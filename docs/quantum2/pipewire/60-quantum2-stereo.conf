# Stereo "Main Out 1/2" sink for the PreSonus Quantum 2 (snd-quantum, 24ch AUX sink).
# Install to ~/.config/pipewire/pipewire.conf.d/ together with
# ../wireplumber/60-quantum2-node-name.conf (provides the target name).
context.modules = [
  { name = libpipewire-module-loopback
    args = {
      node.description = "Quantum 2 Main Out 1/2"
      capture.props = {
        node.name      = "quantum2_main_out"
        media.class    = "Audio/Sink"
        audio.position = [ FL FR ]
      }
      playback.props = {
        node.name      = "quantum2_main_out.playback"
        audio.position = [ AUX0 AUX1 ]
        target.object  = "quantum2_multichannel_out"
        stream.dont-remix = true
        node.passive   = true
      }
    }
  }
]
