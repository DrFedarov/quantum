# PreSonus Quantum 2 (snd-quantum): stable node names.
# The default name embeds the Thunderbolt PCI address (e6:00.0 when
# hotplugged, cf:00.0 when authorized at boot), so the saved default sink
# and source were lost whenever the address changed.

monitor.alsa.rules = [
  {
    matches = [ { alsa.card_name = "PreSonus Quantum 2", device.profile.name = "HiFi: Speaker: sink" } ]
    actions = { update-props = { node.name = "quantum2.main_out" } }
  }
  {
    matches = [ { alsa.card_name = "PreSonus Quantum 2", device.profile.name = "HiFi: Line3: sink" } ]
    actions = { update-props = { node.name = "quantum2.line_out_3_4" } }
  }
  {
    matches = [ { alsa.card_name = "PreSonus Quantum 2", device.profile.name = "HiFi: Mic1: source" } ]
    actions = { update-props = { node.name = "quantum2.mic_inst_1" } }
  }
  {
    matches = [ { alsa.card_name = "PreSonus Quantum 2", device.profile.name = "HiFi: Mic2: source" } ]
    actions = { update-props = { node.name = "quantum2.mic_inst_2" } }
  }
  {
    matches = [ { alsa.card_name = "PreSonus Quantum 2", device.profile.name = "HiFi: Mic3: source" } ]
    actions = { update-props = { node.name = "quantum2.mic_line_3" } }
  }
  {
    matches = [ { alsa.card_name = "PreSonus Quantum 2", device.profile.name = "HiFi: Mic4: source" } ]
    actions = { update-props = { node.name = "quantum2.mic_line_4" } }
  }
]
