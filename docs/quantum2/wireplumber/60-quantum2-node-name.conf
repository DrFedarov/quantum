# Give the Quantum 2's ALSA nodes stable names. The default names embed the
# PCI address, which changes depending on when the Thunderbolt device is
# authorized (hotplug vs. boot).
# Install to ~/.config/wireplumber/wireplumber.conf.d/
monitor.alsa.rules = [
  {
    matches = [ { alsa.id = "Quantum2", media.class = "Audio/Sink" } ]
    actions = { update-props = { node.name = "quantum2_multichannel_out" } }
  }
  {
    matches = [ { alsa.id = "Quantum2", media.class = "Audio/Source" } ]
    actions = { update-props = { node.name = "quantum2_multichannel_in" } }
  }
]
