# PreSonus Quantum 2 (1c67:0102): one shared hardware stream per direction,
# 24 playback / 22 capture channels (QUANTUM_REG_CHANNEL_COUNTS = 0x1816).
#
# Channel order:
#   playback 0-1  Main Out 1/2 (verified by ear; headphones mirror it in hardware)
#   playback 2-3  Line Out 3/4 (assumed: analog first, as on the 2626)
#   capture  0-3  Mic/Inst 1-4 (assumed: analog first, as on the 2626)
# The remaining channels (S/PDIF, ADAT) are not mapped until verified.

LibraryConfig.pcm.SubstiConfig.pcm.quantum2_stereo_out {
	@args [ CARD DEV CHN0 CHN1 ]
	@args {
		CARD.type string
		DEV.type integer
		CHN0.type integer
		CHN1.type integer
	}

	type dshare
	ipc_key 10267
	ipc_key_add_uid true
	slowptr true

	slave {
		pcm {
			type hw
			card $CARD
			device $DEV
		}
		format S32_LE
		rate 48000
		channels 24
		period_size 128
		periods 4
	}

	bindings.0 $CHN0
	bindings.1 $CHN1
}

LibraryConfig.pcm.SubstiConfig.pcm.quantum2_mono_in {
	@args [ CARD DEV CHN ]
	@args {
		CARD.type string
		DEV.type integer
		CHN.type integer
	}

	type dsnoop
	ipc_key 10268
	ipc_key_add_uid true

	slave {
		pcm {
			type hw
			card $CARD
			device $DEV
		}
		format S32_LE
		rate 48000
		channels 22
		period_size 128
		periods 4
	}

	bindings.0 $CHN
}

SectionDevice."Speaker" {
	Comment "Main Out 1/2 + Headphones"
	Value {
		PlaybackPriority 1000
		PlaybackChannels 2
		PlaybackPCM "quantum2_stereo_out:${CardId},0,0,1"
	}
}

SectionDevice."Line3" {
	Comment "Line Out 3/4"
	Value {
		PlaybackPriority 900
		PlaybackChannels 2
		PlaybackPCM "quantum2_stereo_out:${CardId},0,2,3"
	}
}

SectionDevice."Mic1" {
	Comment "Mic/Inst 1"
	Value {
		CapturePriority 1000
		CaptureChannels 1
		CapturePCM "quantum2_mono_in:${CardId},0,0"
	}
}

SectionDevice."Mic2" {
	Comment "Mic/Inst 2"
	Value {
		CapturePriority 990
		CaptureChannels 1
		CapturePCM "quantum2_mono_in:${CardId},0,1"
	}
}

SectionDevice."Mic3" {
	Comment "Mic/Line 3"
	Value {
		CapturePriority 980
		CaptureChannels 1
		CapturePCM "quantum2_mono_in:${CardId},0,2"
	}
}

SectionDevice."Mic4" {
	Comment "Mic/Line 4"
	Value {
		CapturePriority 970
		CaptureChannels 1
		CapturePCM "quantum2_mono_in:${CardId},0,3"
	}
}
