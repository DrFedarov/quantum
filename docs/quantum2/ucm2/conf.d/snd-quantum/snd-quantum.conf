Syntax 6

# snd-quantum serves several Quantum models; pick the profile by ALSA card id.
If.Quantum2 {
	Condition {
		Type String
		String1 "${CardId}"
		String2 "Quantum2"
	}
	True {
		Comment "PreSonus Quantum 2"
		SectionUseCase."HiFi" {
			Comment "48 kHz multichannel duplex audio"
			File "/Quantum2/HiFi.conf"
		}
	}
}
